name: branches

# Keeps open pull requests mergeable without asking the author to do it, the way
# is-a-dev does. A pull request that cannot be updated is one that has drifted
# far enough to conflict; it gets a label and one comment, not a silent failure.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-branches
  cancel-in-progress: false

jobs:
  update:
    name: Update open pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- merge-conflict -->';
            const { owner, repo } = context.repo;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            core.info(`found ${prs.length} open pull requests`);

            for (const pr of prs) {
              if (pr.draft) continue;

              try {
                await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
                core.info(`updated #${pr.number} (${pr.head.ref})`);
                continue;
              } catch (error) {
                core.info(`could not update #${pr.number}: ${error.message}`);
              }

              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              if (fresh.mergeable !== false) continue;

              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['merge conflict'],
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              if (comments.some((c) => c.body && c.body.includes(marker))) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  marker,
                  '## Merge conflict',
                  '',
                  'This branch conflicts with `main`, so the check cannot judge it.',
                  '',
                  'Rebase on `main` or resolve the conflict in the files GitHub lists below, then push.',
                  'A maintainer can also update the branch from the pull request page.',
                ].join('\n'),
              });
              core.info(`marked #${pr.number}`);
            }
